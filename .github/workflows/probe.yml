name: CI Gate Probe
#
# SYNTHETIC CI-GATE PROBE — DISPOSABLE REPOSITORY, NOT A REAL PROJECT.
#
# This workflow exists only to verify the behaviour of the `ci-gate` job and
# of GitHub's required-status-check semantics. It contains NO production code,
# NO dependencies, NO secrets and no copied project history.
#
# What it faithfully reproduces from the production workflow:
#   * the eight job IDs, including `ci-gate`
#   * the eight displayed check names, character for character
#   * the dependency graph: one root, six leaves each `needs` the root
#   * `concurrency` with `cancel-in-progress: true` (required for T4)
#   * `permissions: contents: read`, with no job-level override
#   * the `ci-gate` job BYTE-FOR-BYTE from production commit fd86b40
#
# What it deliberately does NOT reproduce: the job bodies. Each validation job
# is a stub whose exit status is chosen by `scripts/stub.sh` from the single
# `variant` file at the repository root. A run therefore takes seconds rather
# than the hour the real suite needs, and the thing under test — result
# aggregation and protection semantics — is unaffected.
#
# The workflow NAME is deliberately neutral. Required status checks match on
# the CHECK-RUN name, which for Actions comes from each job's `name:` — not
# from the workflow's `name:`. So the workflow name needs no fidelity to
# production, and a neutral one avoids publishing a product name. The eight
# job display names DO have to match character for character, and they do;
# they unavoidably contain `apps/web`, `apps/api` and `apps/worker`, which is
# the only production-derived content in this repository.
#
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch: {}

# Identical in shape to production. `cancel-in-progress: true` is what makes
# experiment T4 (cancellation) possible; do not remove it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, matching production. Never add a job-level `permissions`
# block and never add a secret to this repository.
permissions:
  contents: read

jobs:
  # ─── Root validation job ────────────────────────────────────────────
  # Nothing can skip this job: it has no `needs` and no `if`. When it
  # FAILS, the six leaves below conclude `skipped` rather than `failure`,
  # which is the behaviour the whole experiment matrix exists to probe.
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh lint-and-typecheck

  # ─── Six leaf validation jobs ───────────────────────────────────────
  # Each needs the root, exactly as in production. For experiment T3b,
  # add `if: false` to the `build` job below (and only to that job).
  unit-tests:
    name: Unit Tests (shared / config / events / storage / domain)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh unit-tests

  frontend-tests:
    name: Frontend Tests (apps/web)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh frontend-tests

  api-integration-tests:
    name: API Integration Tests (apps/api)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh api-integration-tests

  worker-tests:
    name: Worker Tests (apps/worker)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh worker-tests

  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh build

  release-images:
    name: Release Images (build + container smoke)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/stub.sh release-images

  # ───────────────────────────────────────────────────────────────────
  # Fail-closed aggregation gate.
  #
  # Branch protection is meant to require THIS check rather than the
  # seven jobs above. The reason is that a SKIPPED check counts as a
  # satisfied required check: when `lint-and-typecheck` fails, the six
  # jobs that need it conclude `skipped`, not `failure`. Observed on run
  # 38117063684 — one `failure` and six `skipped`. A required-check list
  # made only of those six would therefore read as green on a run where
  # nothing was tested.
  #
  # Two invariants this job must never lose:
  #
  #   1. `if:` is `always()` and nothing else. Any condition that can
  #      evaluate false makes THIS job report `skipped`, which counts as
  #      success — precisely the failure it exists to prevent. In
  #      particular `!cancelled()` is NOT acceptable here: this workflow
  #      sets `cancel-in-progress: true`, cancelled runs do happen (run
  #      37896587348), and the gate must fail on them rather than vanish.
  #
  #   2. No dependency result is tested in `if:`. Every result check
  #      happens in the step below, which exits non-zero. A job-level
  #      condition would convert "a dependency failed" into "the gate was
  #      skipped", which reads as success.
  #
  # If this job is deleted or renamed, the required check simply never
  # reports and stays pending, which blocks the merge. That direction is
  # safe. The unsafe direction is a gate that reports `skipped`.
  # ───────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI Gate Renamed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - lint-and-typecheck
      - unit-tests
      - frontend-tests
      - api-integration-tests
      - worker-tests
      - build
      - release-images
    steps:
      - name: Assert every required job succeeded
        # The needs context is passed through the environment, never
        # interpolated into the script body, so no context value can be
        # parsed as shell source.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail

          # Keep this list identical to `needs:` above. The drift check
          # below fails the gate if the two ever diverge.
          REQUIRED=(
            lint-and-typecheck
            unit-tests
            frontend-tests
            api-integration-tests
            worker-tests
            build
            release-images
          )

          # An emptied list would otherwise vacuously pass.
          if [ "${#REQUIRED[@]}" -eq 0 ]; then
            echo "::error::REQUIRED is empty; the gate would assert nothing"
            exit 1
          fi

          printf '%s' "$NEEDS_JSON" > "$RUNNER_TEMP/needs.json"

          # Unevaluable context -> fail. Never assume success.
          if ! jq -e 'type == "object" and length > 0' "$RUNNER_TEMP/needs.json" >/dev/null 2>&1; then
            echo "::error::needs context is empty, malformed, or not an object; cannot evaluate required jobs"
            exit 1
          fi

          failed=0

          # `success` is the only accepted value. failure, cancelled and
          # skipped are all rejected, as are missing and null results.
          # A malformed entry makes jq exit non-zero, and `set -e` turns
          # that into a failed step rather than a silent pass.
          for job in "${REQUIRED[@]}"; do
            result="$(jq -r --arg j "$job" \
              'if has($j) then (.[$j].result // "<null>") else "<missing>" end' \
              "$RUNNER_TEMP/needs.json")"
            printf '%-30s %s\n' "$job" "$result"
            if [ "$result" != "success" ]; then
              echo "::error::required job '$job' did not succeed (result: $result)"
              failed=1
            fi
          done

          # Drift check: a job added to `needs:` but absent from REQUIRED
          # would otherwise go unevaluated.
          #
          # The key list is captured by command substitution, NOT read
          # from a process substitution: `set -e` sees a jq failure here,
          # whereas a failure inside `< <(...)` would silently yield an
          # empty loop and pass. `mapfile` then runs in this shell, so
          # `failed` is not lost to a subshell the way a pipe would lose
          # it.
          keys_raw="$(jq -r 'keys[]' "$RUNNER_TEMP/needs.json")"
          mapfile -t actual <<< "$keys_raw"

          for job in "${actual[@]}"; do
            [ -n "$job" ] || continue
            case " ${REQUIRED[*]} " in
              *" ${job} "*) ;;
              *) echo "::error::job '${job}' is in needs: but not in REQUIRED; the gate definition has drifted"
                 failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::CI Gate FAILED"
            exit 1
          fi

          echo "CI Gate PASSED — all ${#REQUIRED[@]} required jobs succeeded."
